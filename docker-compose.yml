services:
  app:
    build: .
    container_name: yuanqing-ai
    volumes:
      - yuanqing-d1-data:/app/.wrangler/state/v3/d1
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: yuanqing-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  yuanqing-d1-data:
    driver: local
